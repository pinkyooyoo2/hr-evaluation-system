services:
  - type: web
    name: hr-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py create_default_admin
      python manage.py seed_demo_hr_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://hr-evaluation-system2.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hr-db
          property: connectionString

  - type: web
    name: hr-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hr-backend.onrender.com

databases:
  - name: hr-db
    databaseName: hr_system
    user: hruser
    plan: free
